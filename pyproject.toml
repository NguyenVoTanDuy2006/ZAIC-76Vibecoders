[project]
name = "lifemate"
version = "0.1.0"
description = "ASR benchmarking, ASR fine-tuning, and a tool-using agent for LifeMate"
readme = "README.md"
authors = [
    { name = "Nguyen Vo Tan Duy", email = "nguyenvotanduy2006@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
asr = [
    "accelerate>=1.12.0",
    "bert-score==0.3.13",
    "huggingface-hub>=0.34.0",
    "librosa>=0.11.0",
    "numpy>=2.0.0",
    "pyvi==0.1.1",
    "qwen-asr==0.0.6",
    "soundfile>=0.13.0",
    "transformers==4.57.6",
]

[project.scripts]
lifemate-agent = "lifemate.agent:main"
lifemate-eval = "lifemate.evaluation.__main__:main"
asr-benchmark = "asr_benchmark.interfaces.cli:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["asr_benchmark", "lifemate"]
